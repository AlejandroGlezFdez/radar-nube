<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de tendencias</title>
<style>
:root{--fondo:#f6f7f9;--carta:#fff;--texto:#1d2330;--suave:#667085;--borde:#e3e6eb;--acento:#2f6fde;--ok:#1f8a4c;--aviso:#b26a00;--mal:#c0392b;--chip:#eef2f8;--gente:#f3f0fb}
@media (prefers-color-scheme:dark){:root{--fondo:#12151b;--carta:#1b2029;--texto:#e6e9ef;--suave:#98a2b3;--borde:#2b3240;--acento:#6c9cff;--ok:#4cc38a;--aviso:#f0a83a;--mal:#ff7a6b;--chip:#252c38;--gente:#231f33}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--fondo);border-bottom:1px solid var(--borde);padding:12px 16px 0}
.fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0;flex:1}
#hecho{color:var(--suave);font-size:12px}
button,select{font:inherit;border:1px solid var(--borde);background:var(--carta);color:var(--texto);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--acento);border-color:var(--acento);color:#fff}
.pestanas{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.pestanas button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 10px;white-space:nowrap}
.pestanas button.on{border-bottom-color:var(--acento);color:var(--acento);background:none;font-weight:600}
main{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.carta{background:var(--carta);border:1px solid var(--borde);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.carta.leida{opacity:.55}
.carta.guardada{border-left:4px solid var(--aviso)}
.tit{font-weight:650;font-size:16px;margin:0 0 4px}
.meta{color:var(--suave);font-size:13px}
.contexto{color:var(--suave);font-size:14px;margin:4px 0}
.gente{background:var(--gente);border-radius:8px;padding:8px 10px;margin:8px 0 4px;font-size:14px}
.gente b{display:block;font-size:12px;color:var(--suave);font-weight:600;margin-bottom:2px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.chip{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px}
.chip.alta{color:var(--mal)}.chip.media{color:var(--aviso)}.chip.baja{color:var(--suave)}
details{margin-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--acento)}
details li{margin:4px 0}
details a{color:var(--acento)}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vacio{color:var(--suave);text-align:center;padding:30px 0}
.frase{background:var(--carta);border:1px solid var(--borde);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.frase b{display:block}
.aviso{background:var(--chip);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--suave);margin-bottom:10px}
h2{font-size:15px;margin:18px 0 8px;color:var(--suave)}
.tend{display:flex;gap:10px;align-items:flex-start}
.tend .num{color:var(--suave);font-weight:600;min-width:22px}
.carta.oferta{border-left:4px solid var(--ok)}
.afecta{background:var(--chip);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.fecha{display:inline-block;min-width:54px;text-align:center;background:var(--chip);border-radius:8px;padding:4px 6px;font-weight:650;margin-right:10px;line-height:1.2}
.fecha small{display:block;font-weight:400;font-size:11px;color:var(--suave)}
.venta{color:var(--aviso);font-weight:600;font-size:13px}
.sinver{color:var(--aviso);font-size:12px}
form.anadir{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
form.anadir input{flex:1;min-width:0;font:inherit;border:1px solid var(--borde);background:var(--carta);color:var(--texto);border-radius:8px;padding:6px 10px}
</style>
</head>
<body>
<header>
  <div class="fila"><h1>📡 Radar de tendencias</h1><span id="hecho"></span><a id="aRedes" href="redes" style="color:var(--acento);font-size:14px;text-decoration:none">🌐 Redes en directo</a><button id="recoger">Actualizar</button></div>
  <div class="pestanas" id="pestanas"></div>
</header>
<main id="main"><p class="vacio">Cargando…</p></main>
<script>
const CAP = window.Capacitor, NATIVO = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
// Copia en GitHub Pages (nube.py): sirve fuera de casa aunque el PC esté dormido; primero intenta hablar con el PC
const NUBE = location.hostname.endsWith('github.io');
const PC = 'https://desktop-ahmae4i.tailc1ba64.ts.net/tendencias', COPIA = 'https://alejandroglezfdez.github.io/radar-nube/datos.enc.json';
const B = NATIVO || NUBE ? PC : location.pathname.replace(/\/(index\.html)?$/, '');
document.getElementById('aRedes').href = B + '/redes';
const guarda = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lee = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let D = {temas: [], espana: {}, marcas: {}}, pest = lee('radar-pest', 'resumen'), ocultarLeidas = lee('radar-ocultar', false), dia = '';
const enlaceClave = location.hash.match(/k=([\w-]+)/);
if (enlaceClave) { guarda('radar-clave', enlaceClave[1]); history.replaceState(null, '', location.pathname); }

async function conTiempo(url, ms, opciones = {}) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {...opciones, cache: 'no-store', signal: c.signal}); if (!r.ok) throw new Error(r.status); return r; } finally { clearTimeout(t); }
}

async function descifrar(sobre, clave) {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(clave), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b(sobre.sal), iterations: sobre.vueltas, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(sobre.iv)}, k, b(sobre.datos))));
}

async function subirPendientes() {  // marcas hechas sin PC: se mandan en cuanto vuelve a responder
  const p = lee('radar-pendientes', {});
  for (const [id, marca] of Object.entries(p)) {
    try { await conTiempo(B + '/marca', 5000, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, marca})}); delete p[id]; } catch (e) { break; }
  }
  guarda('radar-pendientes', p);
}

async function cargar() {
  try {
    D = await (await conTiempo(B + '/datos.json', NUBE || NATIVO ? 5000 : 30000)).json(); guarda('radar-datos', D);
    await subirPendientes();
  } catch (e) {
    try {
      const clave = lee('radar-clave', '');
      if (!clave) throw new Error('sin clave');
      D = await descifrar(await (await conTiempo(COPIA, 15000)).json(), clave); D.desdeNube = true; guarda('radar-datos', D);
    } catch (e2) { D = lee('radar-datos', D); D.sinConexion = true; D.sinClave = !lee('radar-clave', ''); }
  }
  D.marcas = {...(D.marcas || {}), ...lee('radar-pendientes', {})};
  for (const k in D.marcas) if (!D.marcas[k]) delete D.marcas[k];
  if (dia && !D.desdeNube) { try { const h = await (await fetch(`${B}/historico/${dia}.json`)).json(); h.marcas = D.marcas; h.dias = D.dias; h.recogiendo = D.recogiendo; D = h; } catch (e) {} }
  pinta();
}

async function marca(id, valor) {
  D.marcas[id] = D.marcas[id] === valor ? '' : valor;
  pinta();
  const nueva = D.marcas[id] || '';
  if (!nueva) delete D.marcas[id];
  try { await conTiempo(B + '/marca', 5000, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id, marca: nueva})}); }
  catch (e) { const p = lee('radar-pendientes', {}); p[id] = nueva; guarda('radar-pendientes', p); }
}

// vídeos de TikTok: los baja el PC y se ven sueltos (/ver), sin entrar en TikTok ni en su scroll
const enlace = u => /tiktok\.com\/.*\/(video|photo)\/\d+|(vm|vt)\.tiktok\.com\//.test(u || '') ? B + '/ver?u=' + encodeURIComponent(u) : u;
function fuentes(lista) {
  if (!lista || !lista.length) return '';
  return `<details><summary>Fuentes (${lista.length}), por si quieres ampliar</summary><ul>${lista.map(f =>
    `<li><a href="${esc(enlace(f.url))}" target="_blank" rel="noopener">${esc(f.titulo || f.url)}</a><br><span class="meta">${esc([f.red, f.donde || f.medio, f.fecha, f.interaccion].filter(Boolean).join(' · '))}</span></li>`).join('')}</ul></details>`;
}

function botones(id) {
  const m = D.marcas[id];
  // 👎 enseña al radar qué no te interesa: ese tema baja en el resumen y el meta-análisis lo tiene en cuenta
  return `<div class="acciones"><button class="${m === 'leida' ? 'on' : ''}" onclick="marca('${id}','leida')">✓ Leída</button><button class="${m === 'guardada' ? 'on' : ''}" onclick="marca('${id}','guardada')">☆ Guardar</button><button class="${m === 'nointeresa' ? 'on' : ''}" onclick="marca('${id}','nointeresa')" title="No me interesa">👎</button></div>`;
}

function noticia(n, tema) {
  const m = D.marcas[n.id] || '';
  if (ocultarLeidas && (m === 'leida' || m === 'nointeresa') && pest !== 'guardadas') return '';
  return `<div class="carta ${m === 'nointeresa' ? 'leida' : m}">
    <p class="tit">${esc(n.titulo)}</p>
    <div class="chips">${tema ? `<span class="chip">${esc(tema.emoji + ' ' + tema.nombre)}</span>` : ''}<span class="chip">${esc(n.tipo || '')}</span><span class="chip ${esc(n.importancia)}">importancia ${esc(n.importancia || '?')}</span></div>
    ${n.contexto ? `<p class="contexto">${esc(n.contexto)}</p>` : ''}
    <p>${esc(n.que_pasa)}</p>
    ${n.que_dice_la_gente ? `<div class="gente"><b>💬 Qué dice la gente</b>${esc(n.que_dice_la_gente)}</div>` : ''}
    ${fuentes(n.fuentes)}${botones(n.id)}</div>`;
}

function tendencia(t, i) {
  const m = D.marcas[t.id] || '';
  if (ocultarLeidas && m === 'leida') return '';
  const fts = t.red === 'Google' ? (t.noticias || []).map(n => ({...n, red: 'Noticia'})) : [];
  fts.push({titulo: t.red === 'X' ? 'Ver en X' : 'Buscar en Google', url: t.url, red: t.red});
  return `<div class="carta ${m}"><div class="tend"><span class="num">${i + 1}</span><div style="flex:1">
    <p class="tit">${esc(t.nombre)}</p>
    <div class="chips"><span class="chip">${esc(t.red)}${t.trafico ? ' · ' + esc(t.trafico) + ' búsquedas' : ''}</span><span class="chip">${esc(t.categoria)}</span></div>
    <p>${esc(t.explicacion || 'Sin explicación todavía.')}</p>${fuentes(fts)}${botones(t.id)}</div></div></div>`;
}

const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const hoyISO = () => new Date().toISOString().slice(0, 10);
const diaCorto = f => f ? `${+f.slice(8, 10)} ${MESES[+f.slice(5, 7) - 1]}` : '';

function novedad(n) {
  const m = D.marcas[n.id] || '';
  if (ocultarLeidas && m === 'leida' && pest !== 'guardadas') return '';
  const oferta = n.tipo === 'oferta';
  return `<div class="carta ${m} ${oferta ? 'oferta' : ''}">
    <p class="tit">${oferta ? '🎁 ' : ''}${esc(n.titulo)}</p>
    <div class="chips"><span class="chip">${esc(n.herramienta)}</span><span class="chip">${esc(n.tipo || 'novedad')}</span><span class="chip ${esc(n.importancia)}">importancia ${esc(n.importancia || '?')}</span><span class="chip">${esc((n.visto || '').replace('T', ' '))}</span></div>
    <p>${esc(n.explicacion)}</p>
    ${n.te_afecta ? `<div class="afecta">👉 ${esc(n.te_afecta)}</div>` : ''}
    ${fuentes([{titulo: n.fuente_nombre, url: n.url, red: 'Fuente oficial'}])}${botones(n.id)}</div>`;
}

function evento(e) {
  const af = ((D.agenda || {}).aficiones || []).find(a => a.id === e.aficion) || {};
  const venta = e.venta && e.venta >= hoyISO() ? `<div class="venta">🎟️ Entradas a la venta el ${diaCorto(e.venta)}${e.venta_hora ? ' a las ' + esc(e.venta_hora) : ''}</div>` : '';
  const aviso = e.manual ? '<span class="chip">✓ comprobado</span>' : e.enlace_ok === false ? '<span class="sinver">⚠ el enlace no responde: compruébalo antes de fiarte</span>' : '';
  return `<div class="carta ${D.marcas[e.id] || ''}"><div class="tend"><span class="fecha">${diaCorto(e.fecha)}<small>${e.fecha_fin && e.fecha_fin !== e.fecha ? 'al ' + diaCorto(e.fecha_fin) : e.fecha.slice(0, 4)}</small></span><div style="flex:1">
    <p class="tit">${esc(e.nombre)}</p>
    <div class="chips"><span class="chip">${esc((af.emoji || '') + ' ' + (af.nombre || e.aficion))}</span><span class="chip">${esc(e.tipo)}</span>${e.precio ? `<span class="chip">${esc(e.precio)}</span>` : ''}${e.cerca === false ? '<span class="chip">✈️ fuera de Cataluña</span>' : ''}${aviso}</div>
    <p class="meta">📍 ${esc([...new Set([e.lugar, e.ciudad])].filter(x => x && x !== '-').join(', '))}</p>${venta}
    <p>${esc(e.detalle)}</p>
    ${e.url ? fuentes([{titulo: 'Más información y entradas', url: e.url}]) : ''}${botones(e.id)}</div></div></div>`;
}

function comunidad(c) {
  return `<div class="carta"><p class="tit">💬 ${esc(c.nombre)}</p><div class="chips"><span class="chip">${esc(c.plataforma)}</span>${c.manual ? '<span class="chip">✓ comprobado</span>' : c.enlace_ok === false ? '<span class="sinver">⚠ el enlace no responde</span>' : ''}</div>
    <p>${esc(c.detalle)}</p>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" style="color:var(--acento)">Entrar</a>` : ''}</div>`;
}

// 💡 Ideas: las marcas de siempre (estado.json) con cuatro destinos; cada filtro es una bandeja
const DESTINOS = [['guardada', '💾 Me la guardo'], ['aplicar', '🛠️ La aplico'], ['aprendida', '📖 Aprendido'], ['nointeresa', '✕ Descartar']];
const BANDEJAS = [['claude', '⭐ Te recomiendo'], ['nuevas', '🆕 Sin decidir'], ['aplicar', '🛠️ Para aplicar'], ['guardada', '💾 Guardadas'], ['aprendida', '📖 Aprendidas'], ['nointeresa', '✕ Descartadas'], ['todas', 'Todas']];
let bandeja = lee('radar-bandeja', 'claude'), ordenIdeas = lee('radar-orden-ideas', 'encaje');
const FICHAS = {};
// 📋 Encargo para otra IA: la idea + el manual, para pegarlo en Gemini CLI, Codex, OpenCode… cuando se acabe el cupo
function encargo(id) {
  const i = FICHAS[id], man = (D.ideas || {}).manual || 'C:\\Users\\Alejandro\\apps-android\\MANUAL-HACER-UNA-APP.md';
  const t = [
    `Quiero que hagas este proyecto para mí. Antes de nada, lee entero el manual ${man} y sigue sus reglas (sección 0) y sus pasos.`, '',
    `IDEA: ${i.titulo}`, `Tipo: ${i.tipo}`, `Encaja en: ${i.encaja || 'Proyecto nuevo'}`, '',
    `Qué es: ${i.que_es}`, `Por qué me sirve: ${i.para_ti || ''}`, `Primer paso: ${i.primer_paso || ''}`, i.ojo ? `Ojo: ${i.ojo}` : '', '',
    'Si encaja en un proyecto mío que ya existe, búscalo primero en «C:\\Users\\Alejandro\\Mi Espacio Personal\\10 - Programas y Scripts» o en «C:\\Users\\Alejandro\\apps-android» y amplíalo (con copia antes) en vez de empezar de cero.',
    'Hazlo por fases: primero la web funcionando en el PC, luego en el móvil por Tailscale y, si tiene sentido, el APK. Al acabar, dame un resumen corto de qué hay y dónde.'
  ].join('\n');
  const ok = () => { const b = document.getElementById('enc-' + id); if (b) { b.textContent = '✅ Copiado: pégalo en la otra IA'; setTimeout(() => b.textContent = '📋 Encargo para otra IA', 4000); } };
  if (navigator.clipboard && isSecureContext) navigator.clipboard.writeText(t).then(ok, () => copiaVieja(t, ok)); else copiaVieja(t, ok);
}
function copiaVieja(t, ok) {
  const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); ok(); } catch (e) { prompt('Copia este encargo:', t); }
  a.remove();
}
function idea(i) {
  FICHAS[i.id] = i;
  const m = D.marcas[i.id] || '', dif = Math.max(0, Math.min(5, +i.dificultad || 0)), enc = Math.max(0, Math.min(5, +i.encaje || 0));
  return `<div class="carta ${m === 'nointeresa' ? 'leida' : m === 'guardada' || m === 'aplicar' ? 'guardada' : ''}">
    <p class="tit">${i.prioridad ? `<span style="color:var(--acento)">#${i.prioridad}</span> ` : ''}${i.suya ? '✍️ ' : ''}${esc(i.titulo)}</p>
    <div class="chips"><span class="chip">${esc(i.tipo)}</span><span class="chip">→ ${esc(i.encaja || 'Proyecto nuevo')}</span>${dif ? `<span class="chip" title="dificultad">${'●'.repeat(dif)}${'○'.repeat(5 - dif)}</span>` : ''}${enc ? `<span class="chip" title="cuánto encaja contigo">${'★'.repeat(enc)}${'☆'.repeat(5 - enc)}</span>` : ''}${i.prioridad ? '<span class="chip">⭐ Recomendada por Claude</span>' : `<span class="chip">${esc((i.origen || []).join(', '))}</span><span class="chip">${diaCorto(i.visto)}</span>`}</div>
    <p>${esc(i.que_es)}</p>
    ${i.para_ti ? `<div class="gente"><b>🎯 Por qué a ti</b>${esc(i.para_ti)}</div>` : ''}
    ${i.primer_paso ? `<p class="contexto">🛠️ Primer paso: ${esc(i.primer_paso)}</p>` : ''}
    ${i.ojo ? `<p class="contexto">⚠️ ${esc(i.ojo)}</p>` : ''}
    ${i.por_que ? `<p class="contexto">📌 En este puesto porque: ${esc(i.por_que)}</p>` : ''}
    ${fuentes(i.fuentes || [])}<div class="acciones">${DESTINOS.map(([v, n]) => `<button class="${m === v ? 'on' : ''}" onclick="marca('${i.id}','${v}')">${n}</button>`).join('')}<button id="enc-${i.id}" onclick="encargo('${i.id}')">📋 Encargo para otra IA</button></div></div>`;
}

async function anadir(ev, tipo) {
  ev.preventDefault();
  const inp = ev.target.querySelector('input'), nombre = inp.value.trim();
  if (!nombre) return;
  try { await fetch(B + '/' + tipo, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({nombre})}); inp.value = ''; inp.placeholder = tipo === 'idea' ? 'Apuntada: la ficha sale en un par de minutos (recarga)' : 'Añadido: se está buscando, tarda unos minutos'; } catch (e) { inp.placeholder = 'Sin conexión con el PC'; }
}

function pinta() {
  const temas = D.temas || [], esp = D.espana || {};
  const nov = (D.vigia || {}).novedades || [], ag = D.agenda || {eventos: [], comunidades: [], aficiones: []}, meta = D.meta || {};
  const interes = D.interes || {}, temasOrden = [...temas].sort((a, b) => (interes[b.id] || 0) - (interes[a.id] || 0));
  const tabs = [['resumen', '⭐ Resumen'], ['parati', '📱 Para ti'], ['novedades', '🛰️ Novedades'], ['agenda', '🎟️ Agenda'], ['espana', '🇪🇸 España hoy'], ...temasOrden.map(t => [t.id, `${t.emoji} ${t.nombre}`]), ['cultura', '🗣️ Cultura'], ['meta', '🧠 Meta'], ['nichos', '💶 Nichos'], ['ideas', '💡 Ideas'], ['guardadas', '☆ Guardadas']];
  if (!tabs.some(t => t[0] === pest)) pest = 'resumen';
  document.getElementById('pestanas').innerHTML = tabs.map(([id, n]) => `<button class="${id === pest ? 'on' : ''}" onclick="pest='${id}';guarda('radar-pest',pest);pinta();scrollTo(0,0)">${esc(n)}</button>`).join('');
  const rc = D.recogiendo || {};
  const f = D.publicado || D.generado || '', cuando = f ? `${f.slice(8, 10)}/${f.slice(5, 7)} a las ${f.slice(11, 16)}` : '';
  document.getElementById('hecho').textContent = D.sinConexion ? 'Sin conexión: lo último guardado en el móvil'
    : D.desdeNube ? `☁️ PC dormido · copia de ${cuando} (se actualiza sola cada 3 h)`
    : rc.activo ? `Actualizando: ${rc.paso}…` : (D.generado ? 'Actualizado ' + D.generado.replace('T', ' ') : '');
  document.getElementById('recoger').disabled = !!rc.activo;

  const dias = (D.dias || []);
  let h = `<div class="filtros"><label><input type="checkbox" ${ocultarLeidas ? 'checked' : ''} onchange="ocultarLeidas=this.checked;guarda('radar-ocultar',ocultarLeidas);pinta()"> Ocultar leídas</label>

    }
  }
  let pend = false;
  window.limpiarEmojis = (vigilar = true) => {
    if (!document.getElementById('estilo-iconos')) {
      const st = document.createElement('style'); st.id = 'estilo-iconos';
      st.textContent = '.ico-txt{display:inline-flex;vertical-align:-.16em;margin-right:.38em;flex:none}.ico-txt.solo{margin:0}.ico-txt .ico{width:1.08em;height:1.08em}' +
        'h1:has(.chapa) .ico-txt{display:none}';  // en el título va la «chapa» de la app, no el icono suelto
      document.head.append(st);
    }
    limpiar();
    if (vigilar) new MutationObserver(() => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; limpiar(); }); })
      .observe(document.body, {childList: true, subtree: true, characterData: true});
  };
  window.ICONOS = P;
  window.icono = (n, clase = '') => P[n]
    ? `<svg class="ico ${clase}" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`
    : '';
})();
;(document.readyState === 'loading' ? addEventListener('DOMContentLoaded', () => limpiarEmojis()) : limpiarEmojis());
</script>
<!-- </iconos> -->
</body>
</html>
